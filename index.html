<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Customer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-slate-900 via-sky-900 to-slate-900 min-h-screen text-slate-800 font-sans">

    <!-- Modal Login -->
    <div id="loginModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-5 border border-slate-100">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-sky-600">GadgetStore Pro</h2>
                <p class="text-sm text-slate-500">Login ke GadgetStore</p>
            </div>

            <!-- Role Selector -->
            <div class="bg-slate-800 text-white rounded-xl p-2 space-y-2">
                <label class="flex items-center justify-between p-3 rounded-lg hover:bg-slate-700 cursor-pointer">
                    <span class="font-medium text-sm">Customer</span>
                    <input type="radio" name="userRole" value="customer" checked class="accent-sky-500 w-4 h-4">
                </label>
                <div class="border-t border-slate-700"></div>
                <label class="flex items-center justify-between p-3 rounded-lg hover:bg-slate-700 cursor-pointer">
                    <span class="font-medium text-sm">Administrator</span>
                    <input type="radio" name="userRole" value="admin" class="accent-sky-500 w-4 h-4">
                </label>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                    <input type="text" id="loginUser" required placeholder="Masukkan username" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none text-sm bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" id="loginPass" required placeholder="Masukkan password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-sky-500 outline-none text-sm bg-slate-50">
                </div>
                <p id="loginError" class="text-xs text-rose-500 hidden font-medium text-center"></p>
                <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">Login</button>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="hidden">
        <header class="bg-gradient-to-r from-sky-900 to-blue-700 text-white text-center py-6 shadow-md">
            <h1 class="text-2xl font-bold tracking-wide">GadgetStore Management System</h1>
            <p class="text-xs text-sky-200 mt-1">Premium Technology Marketplace</p>
        </header>

        <div class="max-w-4xl mx-auto p-4 space-y-6">
            <!-- Panel Pembeli Bar -->
            <div class="bg-white rounded-xl shadow-sm p-4 flex flex-wrap justify-between items-center gap-3">
                <div class="flex items-center space-x-2">
                    <span class="text-2xl">🛍️</span>
                    <div>
                        <h2 class="font-bold text-slate-800">Panel Pembeli</h2>
                        <p class="text-xs text-slate-500">Selamat datang, <span id="displayUsername" class="font-semibold text-sky-600">User</span></p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button class="bg-emerald-500 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2">
                        🛒 Keranjang (<span id="cartCount">0</span>)
                    </button>
                    <button onclick="logout()" class="bg-rose-500 hover:bg-rose-600 text-white text-sm font-medium px-4 py-2 rounded-lg">Keluar</button>
                </div>
            </div>

            <!-- Katalog Produk -->
            <section class="bg-white rounded-xl shadow-sm p-5 space-y-4">
                <div class="flex justify-between items-center flex-wrap gap-2">
                    <h3 class="text-lg font-bold text-sky-700 flex items-center gap-2">📱 Katalog Produk</h3>
                    <input type="text" id="searchBox" onkeyup="filterProducts()" placeholder="Cari gadget..." class="px-3 py-1.5 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-sky-500">
                </div>
                <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <!-- Produk dirender via JS -->
                </div>
            </section>

            <!-- Status Pesanan -->
            <section class="bg-white rounded-xl shadow-sm p-5">
                <h3 class="text-lg font-bold text-sky-700 mb-4 flex items-center gap-2">📦 Status Pesanan Saya</h3>
                <div id="orderStatus" class="text-center py-6 text-slate-400 text-sm">
                    📦 Belum ada pesanan.
                </div>
            </section>
        </div>
    </div>

    <script>
        let cart = 0;
        const defaultProducts = [
            { id: 1, name: 'TWS Airpods Pro', price: 2555, desc: 'CSCS Premium Quality', image: 'https://via.placeholder.com/200?text=TWS+Airpods', video: '' },
            { id: 2, name: 'Smartphone Galaxy Ultra', price: 12000000, desc: 'Flagship Smartphone', image: 'https://via.placeholder.com/200?text=Galaxy+Ultra', video: '' }
        ];

        function getProducts() {
            return JSON.parse(localStorage.getItem('products')) || defaultProducts;
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.querySelector('input[name="userRole"]:checked').value;
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            const errorEl = document.getElementById('loginError');

            if (role === 'admin') {
                if (user === 'admin' && pass === '12345') {
                    window.location.href = 'admin.html';
                } else {
                    errorEl.innerText = "Username/Password Admin salah! (user: admin, pass: 12345)";
                    errorEl.classList.remove('hidden');
                }
            } else {
                localStorage.setItem('currentUser', user);
                document.getElementById('displayUsername').innerText = user;
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                renderProducts();
            }
        });

        function renderProducts(filter = '') {
            const grid = document.getElementById('productGrid');
            const products = getProducts();
            grid.innerHTML = '';

            const filtered = products.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));

            if(filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-4">Produk tidak ditemukan.</p>`;
                return;
            }

            filtered.forEach(p => {
                grid.innerHTML += `
                    <div class="border rounded-xl p-3 bg-white shadow-sm hover:shadow-md transition">
                        <img src="${p.image}" class="w-full h-40 object-cover rounded-lg mb-2">
                        <h4 class="font-bold text-slate-800">${p.name}</h4>
                        <p class="text-sky-600 font-semibold text-sm">Rp ${Number(p.price).toLocaleString()}</p>
                        <p class="text-xs text-slate-400 my-1 truncate">${p.desc}</p>
                        ${p.video ? `<video src="${p.video}" controls class="w-full h-24 rounded my-2 object-cover"></video>` : ''}
                        <button onclick="addToCart()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold py-2 rounded-lg mt-2">
                            🛒 Tambah ke Keranjang
                        </button>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const query = document.getElementById('searchBox').value;
            renderProducts(query);
        }

        function addToCart() {
            cart++;
            document.getElementById('cartCount').innerText = cart;
            document.getElementById('orderStatus').innerHTML = `
                <div class="bg-emerald-50 text-emerald-700 p-3 rounded-lg text-sm font-medium">
                    ✅ Memproses ${cart} item dalam pesanan.
                </div>
            `;
        }

        function logout() {
            location.reload();
        }
    </script>
</body>
</html>
