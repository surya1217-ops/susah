<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4 pb-12">

    <div class="max-w-3xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-white rounded-xl shadow-sm p-5 flex flex-wrap justify-between items-center gap-3">
            <div>
                <h1 class="text-xl font-bold text-sky-700 flex items-center gap-2">⚙️ Panel Administrator</h1>
                <p class="text-xs text-slate-500">Login sebagai: <strong class="text-slate-700">admin</strong></p>
            </div>
            <div class="flex gap-2">
                <a href="index.html" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold px-4 py-2.5 rounded-lg">🛍️ Halaman Customer</a>
                <a href="index.html" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold px-4 py-2.5 rounded-lg">Keluar</a>
            </div>
        </div>

        <!-- Form Tambah Produk -->
        <div class="bg-white rounded-xl shadow-sm p-6 space-y-4">
            <h2 class="text-lg font-bold text-sky-700 flex items-center gap-2">➕ Tambah Produk Baru</h2>

            <form id="addProductForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Produk</label>
                    <input type="text" id="pName" required placeholder="Contoh: Smartphone Galaxy Ultra" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Harga Produk (Rp)</label>
                    <input type="number" id="pPrice" required placeholder="Contoh: 12000000" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-sky-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Deskripsi Produk</label>
                    <textarea id="pDesc" rows="2" placeholder="Masukkan spesifikasi singkat produk..." class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-sky-500"></textarea>
                </div>

                <div class="border-2 border-dashed border-sky-200 bg-sky-50/50 p-4 rounded-xl text-center">
                    <label class="block text-xs font-semibold text-sky-700 mb-2">📷 Upload Foto Produk</label>
                    <input type="file" id="pImg" accept="image/*" class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
                </div>

                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm shadow-md">
                    💾 Simpan Produk
                </button>
            </form>
        </div>

        <!-- Kelola Katalog Terpasang -->
        <div class="bg-white rounded-xl shadow-sm p-6 space-y-4">
            <h2 class="text-lg font-bold text-sky-700">📋 Daftar Produk Aktif</h2>
            <div id="adminProductList" class="space-y-3">
                <!-- List Produk Admin -->
            </div>
        </div>
    </div>

    <script>
        const initialProducts = [
            { id: '1', name: 'TWS Airpods Pro', price: 2555, desc: 'High Quality Sound', image: 'https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=400', video: '' }
        ];

        function getProducts() {
            return JSON.parse(localStorage.getItem('products')) || initialProducts;
        }

        function loadAdminProducts() {
            const products = getProducts();
            const list = document.getElementById('adminProductList');
            list.innerHTML = '';

            if (products.length === 0) {
                list.innerHTML = `<p class="text-slate-400 text-xs text-center py-3">Tidak ada produk dalam katalog.</p>`;
                return;
            }

            products.forEach((p) => {
                list.innerHTML += `
                    <div class="flex items-center justify-between border p-3 rounded-lg bg-slate-50">
                        <div class="flex items-center gap-3">
                            <img src="${p.image}" class="w-12 h-12 object-cover rounded">
                            <div>
                                <p class="font-bold text-sm">${p.name}</p>
                                <p class="text-xs text-sky-600">Rp ${Number(p.price).toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${p.id}')" class="bg-rose-500 text-white text-xs px-3 py-1.5 rounded hover:bg-rose-600 font-medium">Hapus</button>
                    </div>
                `;
            });
        }

        function deleteProduct(id) {
            let products = getProducts();
            products = products.filter(p => p.id !== id);
            localStorage.setItem('products', JSON.stringify(products));
            loadAdminProducts();
        }

        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('pName').value;
            const price = Number(document.getElementById('pPrice').value);
            const desc = document.getElementById('pDesc').value;
            const imgFile = document.getElementById('pImg').files[0];

            let defaultImg = 'https://images.unsplash.com/photo-1526738549149-8e07eca6c147?w=400';

            const saveProduct = (imageSrc) => {
                let products = getProducts();
                products.push({
                    id: String(Date.now()),
                    name,
                    price,
                    desc,
                    image: imageSrc,
                    video: ''
                });
                localStorage.setItem('products', JSON.stringify(products));
                alert('Produk Berhasil Ditambahkan!');
                document.getElementById('addProductForm').reset();
                loadAdminProducts();
            };

            if (imgFile) {
                const reader = new FileReader();
                reader.onload = (e) => saveProduct(e.target.result);
                reader.readAsDataURL(imgFile);
            } else {
                saveProduct(defaultImg);
            }
        });

        loadAdminProducts();
    </script>
</body>
</html>
