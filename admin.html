<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetStore Pro - Admin Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans p-4">

    <div class="max-w-3xl mx-auto space-y-6">
        <!-- Header Admin Panel -->
        <div class="bg-white rounded-xl shadow-sm p-5 flex flex-wrap justify-between items-center gap-3">
            <div>
                <h1 class="text-xl font-bold text-sky-700 flex items-center gap-2">⚙️ Panel Administrator</h1>
                <p class="text-xs text-slate-500">Login sebagai: <strong class="text-slate-700">admin</strong></p>
            </div>
            <div class="flex gap-2">
                <a href="index.html" class="bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold px-4 py-2.5 rounded-lg flex items-center gap-1">
                    🛍️ Halaman Customer
                </a>
                <a href="index.html" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold px-4 py-2.5 rounded-lg">Keluar</a>
            </div>
        </div>

        <!-- Form Tambah Produk Baru -->
        <div class="bg-white rounded-xl shadow-sm p-6 space-y-4">
            <h2 class="text-lg font-bold text-sky-700 flex items-center gap-2">➕ Tambah Produk Baru</h2>

            <form id="addProductForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Produk</label>
                    <input type="text" id="pName" required placeholder="Contoh: Smartphone Galaxy Ultra" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Harga Produk (Rp)</label>
                    <input type="number" id="pPrice" required placeholder="Contoh: 12000000" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Stok Barang</label>
                    <input type="number" id="pStock" required placeholder="Contoh: 15" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-sky-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Deskripsi Produk</label>
                    <textarea id="pDesc" rows="3" placeholder="Masukkan spesifikasi produk..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
                </div>

                <!-- Input Foto Produk -->
                <div class="border-2 border-dashed border-sky-200 bg-sky-50/50 p-4 rounded-xl text-center">
                    <label class="block text-xs font-semibold text-sky-700 mb-2">📷 Upload Foto Produk</label>
                    <input type="file" id="pImg" accept="image/*" class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
                </div>

                <!-- Input Video Produk (Opsional) -->
                <div class="border-2 border-dashed border-sky-200 bg-sky-50/50 p-4 rounded-xl text-center">
                    <label class="block text-xs font-semibold text-sky-700 mb-2">🎬 Upload Video Produk (Opsional)</label>
                    <input type="file" id="pVideo" accept="video/*" class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-sky-50 file:text-sky-700 hover:file:bg-sky-100">
                </div>

                <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2.5 rounded-lg text-sm flex items-center gap-2 shadow-md">
                    💾 Simpan Produk
                </button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const stock = document.getElementById('pStock').value;
            const desc = document.getElementById('pDesc').value;
            const imgFile = document.getElementById('pImg').files[0];
            const videoFile = document.getElementById('pVideo').files[0];

            let imgUrl = 'https://via.placeholder.com/200?text=No+Image';
            let videoUrl = '';

            const saveAndRedirect = () => {
                let products = JSON.parse(localStorage.getItem('products')) || [];
                products.push({ id: Date.now(), name, price, stock, desc, image: imgUrl, video: videoUrl });
                localStorage.setItem('products', JSON.stringify(products));
                alert('Produk berhasil disimpan!');
                window.location.href = 'index.html';
            };

            if (imgFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgUrl = e.target.result;
                    if (videoFile) {
                        const vReader = new FileReader();
                        vReader.onload = function(ev) {
                            videoUrl = ev.target.result;
                            saveAndRedirect();
                        };
                        vReader.readAsDataURL(videoFile);
                    } else {
                        saveAndRedirect();
                    }
                };
                reader.readAsDataURL(imgFile);
            } else {
                saveAndRedirect();
            }
        });
    </script>
</body>
</html>
